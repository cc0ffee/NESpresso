name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev

    - name: Cache CMake FetchContent dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}/_deps
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-deps-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-deps-

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    # ---- Packaging ----

    - name: Package (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p dist
        cp build/nes dist/
        cp build/libSDL2*.so* dist/ 2>/dev/null || true
        tar -czvf nespresso-linux-x64.tar.gz -C dist .

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item build/Release/nes.exe dist/
        Copy-Item build/Release/SDL2.dll dist/ -ErrorAction SilentlyContinue
        Compress-Archive -Path dist/* -DestinationPath nespresso-windows-x64.zip

    - name: Package (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p dist
        cp build/nes dist/
        cp build/libSDL2*.dylib dist/ 2>/dev/null || true
        tar -czvf nespresso-macos-arm64.tar.gz -C dist .

    - name: Upload release asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          nespresso-linux-x64.tar.gz
          nespresso-windows-x64.zip
          nespresso-macos-arm64.tar.gz
